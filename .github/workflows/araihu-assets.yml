name: Update Arai Hu fallback assets

on:
  repository_dispatch:
    types: [araihu-assets-released]
  workflow_dispatch:
    inputs:
      assets_repository:
        description: Release repository
        required: true
        default: araihu/assets
        type: string
      assets_revision:
        description: Full release commit SHA
        required: true
        type: string
      release:
        description: Stable release tag (vX.Y.Z)
        required: true
        type: string
      release_url:
        description: Immutable tar.gz release URL
        required: true
        type: string
      release_sha256:
        description: Release archive SHA-256
        required: true
        type: string
      release_json_sha256:
        description: release.json SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: araihu-assets-${{ github.event.client_payload.release || inputs.release }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Read and validate exact provenance payload
        id: event
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          EVENT_NAME: ${{ github.event_name }}
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re

          values = json.loads(os.environ["CLIENT_PAYLOAD"] if os.environ["EVENT_NAME"] == "repository_dispatch" else os.environ["INPUTS"])
          keys = {"assets_repository", "assets_revision", "release", "release_url", "release_sha256", "release_json_sha256"}
          if not isinstance(values, dict) or set(values) != keys:
              raise SystemExit("payload must contain exactly six provenance keys")
          if not all(isinstance(values[key], str) for key in keys):
              raise SystemExit("all provenance values must be strings")
          if values["assets_repository"] != "araihu/assets":
              raise SystemExit("assets repository must be araihu/assets")
          if re.fullmatch(r"[0-9a-f]{40}", values["assets_revision"]) is None:
              raise SystemExit("assets revision must be a full commit SHA")
          if re.fullmatch(r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", values["release"]) is None:
              raise SystemExit("release must be a stable SemVer tag")
          expected_url = f"https://github.com/araihu/assets/releases/download/{values['release']}/araihu-assets-{values['release']}.tar.gz"
          if values["release_url"] != expected_url:
              raise SystemExit("release URL differs from immutable archive URL")
          for key in ("release_sha256", "release_json_sha256"):
              if re.fullmatch(r"[0-9a-f]{64}", values[key]) is None:
                  raise SystemExit(f"{key} must be a SHA-256 digest")
          for key in sorted(keys):
              print(f"{key}={values[key]}")
          PY

      - name: Verify tag resolves to dispatched revision
        env:
          ASSETS_REVISION: ${{ steps.event.outputs.assets_revision }}
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.event.outputs.release }}
        run: |
          set -euo pipefail
          object=$(gh api "repos/araihu/assets/git/ref/tags/${RELEASE}" \
            --jq '.object.type + " " + .object.sha')
          read -r object_type object_sha <<< "$object"
          if test "$object_type" = tag; then
            object=$(gh api "repos/araihu/assets/git/tags/${object_sha}" \
              --jq '.object.type + " " + .object.sha')
            read -r object_type object_sha <<< "$object"
          fi
          test "$object_type" = commit
          test "$object_sha" = "$ASSETS_REVISION"

      - name: Create selected-repository App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.ARAIHU_ASSETS_APP_ID }}
          private-key: ${{ secrets.ARAIHU_ASSETS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: manja
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read

      - name: Check out Manja
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download and verify release once
        id: archive
        env:
          RELEASE: ${{ steps.event.outputs.release }}
          RELEASE_SHA256: ${{ steps.event.outputs.release_sha256 }}
          RELEASE_URL: ${{ steps.event.outputs.release_url }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/araihu-assets-${RELEASE}.tar.gz"
          extracted="$RUNNER_TEMP/araihu-assets-${RELEASE}"
          curl --fail --location --silent --show-error --retry 3 \
            --proto '=https' --tlsv1.2 --output "$archive" "$RELEASE_URL"
          printf '%s  %s\n' "$RELEASE_SHA256" "$archive" \
            | sha256sum --check --strict
          while IFS= read -r member; do
            case "$member" in
              /*|../*|*/../*|*/..) echo "unsafe archive member: $member" >&2; exit 1 ;;
            esac
          done < <(tar --list --gzip --file "$archive")
          if tar --list --verbose --gzip --file "$archive" | grep --extended-regexp --quiet '^[lh]'; then
            echo "release archive contains a link" >&2
            exit 1
          fi
          mkdir "$extracted"
          tar --extract --gzip --file "$archive" --directory "$extracted" \
            --no-same-owner --no-same-permissions
          echo "release-dir=$extracted" >> "$GITHUB_OUTPUT"

      - name: Update allowlisted fallback assets
        env:
          ASSETS_REPOSITORY: ${{ steps.event.outputs.assets_repository }}
          ASSETS_REVISION: ${{ steps.event.outputs.assets_revision }}
          RELEASE: ${{ steps.event.outputs.release }}
          RELEASE_JSON_SHA256: ${{ steps.event.outputs.release_json_sha256 }}
          RELEASE_SHA256: ${{ steps.event.outputs.release_sha256 }}
          RELEASE_URL: ${{ steps.event.outputs.release_url }}
        run: |
          set -euo pipefail
          args=(
            -release-dir "${{ steps.archive.outputs.release-dir }}"
            -assets-repository "$ASSETS_REPOSITORY"
            -assets-revision "$ASSETS_REVISION"
            -release "$RELEASE"
            -release-url "$RELEASE_URL"
            -release-sha256 "$RELEASE_SHA256"
            -release-json-sha256 "$RELEASE_JSON_SHA256"
          )
          go run ./cmd/araihu-assets-update "${args[@]}"
          first_diff="$RUNNER_TEMP/first.diff"
          second_diff="$RUNNER_TEMP/second.diff"
          git diff --binary > "$first_diff"
          go run ./cmd/araihu-assets-update "${args[@]}"
          git diff --binary > "$second_diff"
          cmp "$first_diff" "$second_diff"

      - name: Run focused updater tests
        run: go test ./internal/araihuassets ./cmd/araihu-assets-update -count=1

      - name: Select existing labels only
        id: labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          available=$(gh label list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json name --jq '.[].name')
          selected=""
          for label in assets dependencies enhancement; do
            if grep --fixed-strings --line-regexp --quiet "$label" <<< "$available"; then
              selected+="${selected:+$'\n'}$label"
            fi
          done
          {
            echo 'labels<<EOF'
            printf '%s\n' "$selected"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create or update fallback asset PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/araihu-assets-${{ steps.event.outputs.release }}
          base: main
          delete-branch: false
          commit-message: 'build(assets): update Arai Hu fallbacks to ${{ steps.event.outputs.release }}'
          title: 'build(assets): update Arai Hu fallbacks to ${{ steps.event.outputs.release }}'
          body: |
            Automated fallback refresh from immutable `araihu/assets` release `${{ steps.event.outputs.release }}`.

            - Revision: `${{ steps.event.outputs.assets_revision }}`
            - Archive SHA-256: `${{ steps.event.outputs.release_sha256 }}`
            - `release.json` SHA-256: `${{ steps.event.outputs.release_json_sha256 }}`

            This workflow never auto-merges.
          labels: ${{ steps.labels.outputs.labels }}
          add-paths: |
            araihu-assets.json
            internal/web/static/araihu.css
            internal/web/static/favicon.svg
            internal/web/static/manja-mark.svg
            site/internal/site/static/araihu.css
            site/internal/site/static/favicon.svg
            site/internal/site/static/manja-logo.svg
            site/internal/site/static/manja-mark.svg
