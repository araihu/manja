name: Update Arai Hu fallback assets

on:
  repository_dispatch:
    types: [araihu-assets-released]
  workflow_dispatch:
    inputs:
      assets_repository:
        description: Release repository
        required: true
        default: araihu/assets
        type: string
      assets_revision:
        description: Full release commit SHA
        required: true
        type: string
      release:
        description: Stable release tag (vX.Y.Z)
        required: true
        type: string
      release_url:
        description: Immutable tar.gz release URL
        required: true
        type: string
      release_sha256:
        description: Release archive SHA-256
        required: true
        type: string
      release_json_sha256:
        description: release.json SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: araihu-assets-${{ github.event.client_payload.release || inputs.release }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      MANJA_ASSETS_METADATA: ${{ github.workspace }}/.dagger-inputs/manja-assets.json
    steps:
      - name: Check out Manja
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install or verify exact Dagger CLI
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash .github/scripts/setup-dagger.sh

      - name: Materialize provider payload as JSON
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          EVENT_NAME: ${{ github.event_name }}
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          source = os.environ["CLIENT_PAYLOAD"] if os.environ["EVENT_NAME"] == "repository_dispatch" else os.environ["INPUTS"]
          payload = json.loads(source)
          os.makedirs(os.path.dirname(os.environ["MANJA_ASSETS_METADATA"]), exist_ok=True)
          with open(os.environ["MANJA_ASSETS_METADATA"], "x", encoding="utf-8") as output:
              json.dump(payload, output, separators=(",", ":"), sort_keys=True)
          PY

      - name: Verify immutable release and update allowlisted assets with Dagger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dagger call update-araihu-assets \
            --source=. \
            --metadata="$MANJA_ASSETS_METADATA" \
            --github-token=env://GITHUB_TOKEN \
            --trust-domain=assets \
            --run-nonce='${{ github.run_id }}-${{ github.run_attempt }}' \
            export --path=.

      - name: Read Dagger-validated provenance for PR adapter
        id: event
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          with open(os.environ["MANJA_ASSETS_METADATA"], encoding="utf-8") as source:
              payload = json.load(source)
          for key in sorted(payload):
              print(f"{key}={payload[key]}")
          PY

      - name: Create selected-repository App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ARAIHU_ASSETS_APP_ID }}
          private-key: ${{ secrets.ARAIHU_ASSETS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: manja
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read

      - name: Select existing labels only
        id: labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          available=$(gh label list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json name --jq '.[].name')
          selected=""
          for label in assets dependencies enhancement; do
            if grep --fixed-strings --line-regexp --quiet "$label" <<< "$available"; then
              selected+="${selected:+$'\n'}$label"
            fi
          done
          {
            echo 'labels<<EOF'
            printf '%s\n' "$selected"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create or update fallback asset PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/araihu-assets-${{ steps.event.outputs.release }}
          base: main
          delete-branch: false
          commit-message: 'build(assets): update Arai Hu fallbacks to ${{ steps.event.outputs.release }}'
          title: 'build(assets): update Arai Hu fallbacks to ${{ steps.event.outputs.release }}'
          body: |
            Automated fallback refresh from immutable `araihu/assets` release `${{ steps.event.outputs.release }}`.

            - Revision: `${{ steps.event.outputs.assets_revision }}`
            - Archive SHA-256: `${{ steps.event.outputs.release_sha256 }}`
            - `release.json` SHA-256: `${{ steps.event.outputs.release_json_sha256 }}`

            This workflow never auto-merges.
          labels: ${{ steps.labels.outputs.labels }}
          add-paths: |
            araihu-assets.json
            internal/web/static/araihu.css
            internal/web/static/favicon.svg
            internal/web/static/manja-mark.svg
            site/internal/site/static/araihu.css
            site/internal/site/static/favicon.svg
            site/internal/site/static/manja-logo.svg
            site/internal/site/static/manja-mark.svg
