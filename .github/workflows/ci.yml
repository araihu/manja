name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.actor &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-pr"]') ||
        github.event_name == 'push' &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-trusted"]') ||
        'ubuntu-latest'
      }}
    env:
      MANJA_TRUST_DOMAIN: >-
        ${{
          github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'fork' ||
          github.event_name == 'pull_request' && 'internal' ||
          github.ref_type == 'tag' && 'release' ||
          'main'
        }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install or verify exact Dagger CLI
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash .github/scripts/setup-dagger.sh
      - name: Verify root and standalone site with Dagger
        run: |
          test -z "$(git ls-files '.dagger/sdk/**')"
          dagger call verify --source=. --trust-domain="$MANJA_TRUST_DOMAIN"

  integration:
    timeout-minutes: 15
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.actor &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-pr"]') ||
        github.event_name == 'push' &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-trusted"]') ||
        'ubuntu-latest'
      }}
    env:
      MANJA_TRUST_DOMAIN: >-
        ${{
          github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'fork' ||
          github.event_name == 'pull_request' && 'internal' ||
          github.ref_type == 'tag' && 'release' ||
          'main'
        }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install or verify exact Dagger CLI
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash .github/scripts/setup-dagger.sh
      - name: Run isolated container-backed integration with Dagger
        run: dagger call integration --source=. --trust-domain="$MANJA_TRUST_DOMAIN"

  image:
    name: Build and publish image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, integration]
    runs-on: ${{ fromJSON('["self-hosted","Linux","X64","hostinger-vps-trusted"]') }}
    permissions:
      contents: read
      packages: write
    env:
      MANJA_METADATA: ${{ github.workspace }}/.dagger-inputs/manja-publish.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install or verify exact Dagger CLI
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash .github/scripts/setup-dagger.sh
      - name: Materialize trusted publish identity
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REGISTRY_USERNAME: ${{ github.actor }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          import re

          source_sha = os.environ["SOURCE_SHA"]
          if re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
              raise SystemExit("source SHA must be a full lowercase Git SHA-1")
          created = datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")
          payload = {
              "created": created,
              "ref_name": os.environ["REF_NAME"],
              "ref_type": os.environ["REF_TYPE"],
              "registry_username": os.environ["REGISTRY_USERNAME"],
              "source_repository": os.environ["SOURCE_REPOSITORY"],
              "source_sha": source_sha,
          }
          os.makedirs(os.path.dirname(os.environ["MANJA_METADATA"]), exist_ok=True)
          with open(os.environ["MANJA_METADATA"], "x", encoding="utf-8") as output:
              json.dump(payload, output, separators=(",", ":"), sort_keys=True)
          PY
      - name: Build and publish exact image set with Dagger
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$REGISTRY_TOKEN"
          dagger call publish-image \
            --source=. \
            --metadata="$MANJA_METADATA" \
            --registry-token=env://REGISTRY_TOKEN \
            --run-nonce='${{ github.run_id }}-${{ github.run_attempt }}'

  deploy:
    name: Trigger Fly deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, integration]
    runs-on: ${{ fromJSON('["self-hosted","Linux","X64","hostinger-vps-trusted"]') }}
    concurrency: deploy-group
    env:
      MANJA_METADATA: ${{ github.workspace }}/.dagger-inputs/manja-deploy.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install or verify exact Dagger CLI
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash .github/scripts/setup-dagger.sh
      - name: Materialize trusted deployment identity
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os

          keys = ("source_repository", "source_run_id", "source_sha")
          payload = {key: os.environ[key.upper()] for key in keys}
          os.makedirs(os.path.dirname(os.environ["MANJA_METADATA"]), exist_ok=True)
          with open(os.environ["MANJA_METADATA"], "x", encoding="utf-8") as output:
              json.dump(payload, output, separators=(",", ":"), sort_keys=True)
          PY
      - name: Dispatch central deployment with Dagger
        env:
          FLY_DEPLOY_DISPATCH_TOKEN: ${{ secrets.FLY_DEPLOY_DISPATCH_TOKEN }}
        run: |
          test -n "$FLY_DEPLOY_DISPATCH_TOKEN"
          dagger call dispatch-fly \
            --metadata="$MANJA_METADATA" \
            --token=env://FLY_DEPLOY_DISPATCH_TOKEN \
            --run-nonce='${{ github.run_id }}-${{ github.run_attempt }}'
