name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: go mod tidy
      - run: git diff --exit-code go.mod go.sum
      - run: go run github.com/playwright-community/playwright-go/cmd/playwright@v0.5700.1 install --with-deps chromium
      - run: go test ./...
      - run: go test ./...
        working-directory: site
      - run: npm run api:bundle
      - run: npm run api:lint

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags=integration ./internal/integration -v

  deploy:
    name: Trigger Fly deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, integration]
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - name: Dispatch central deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FLY_DEPLOY_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'araihu',
              repo: 'fly-deploy',
              event_type: 'manja-main',
              client_payload: {
                manja_ref: context.sha,
                manja_sha: context.sha,
                manja_run_id: String(context.runId),
                source_repository: `${context.repo.owner}/${context.repo.repo}`,
              },
            })
