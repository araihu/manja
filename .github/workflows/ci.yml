name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.actor &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-pr"]') ||
        github.event_name == 'push' &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-trusted"]') ||
        'ubuntu-latest'
      }}
    env:
      MANJA_TRUST_DOMAIN: >-
        ${{
          github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'fork' ||
          github.event_name == 'pull_request' && 'internal' ||
          github.ref_type == 'tag' && 'release' ||
          'main'
        }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install or verify exact Dagger CLI
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash .github/scripts/setup-dagger.sh
      - name: Verify root and standalone site with Dagger
        run: |
          test -z "$(git ls-files '.dagger/sdk/**')"
          dagger call verify --source=. --trust-domain="$MANJA_TRUST_DOMAIN"

  integration:
    timeout-minutes: 15
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.actor &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-pr"]') ||
        github.event_name == 'push' &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-trusted"]') ||
        'ubuntu-latest'
      }}
    env:
      MANJA_TRUST_DOMAIN: >-
        ${{
          github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'fork' ||
          github.event_name == 'pull_request' && 'internal' ||
          github.ref_type == 'tag' && 'release' ||
          'main'
        }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install or verify exact Dagger CLI
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash .github/scripts/setup-dagger.sh
      - name: Run isolated container-backed integration with Dagger
        run: dagger call integration --source=. --trust-domain="$MANJA_TRUST_DOMAIN"

  image:
    name: Build and publish image
    needs: [test, integration]
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.actor &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-pr"]') ||
        github.event_name == 'push' &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-trusted"]') ||
        'ubuntu-latest'
      }}
    permissions:
      contents: read
      packages: write
    env:
      MANJA_METADATA: ${{ github.workspace }}/.dagger-inputs/manja-publish.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install or verify exact Dagger CLI
        if: github.event_name != 'pull_request'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash .github/scripts/setup-dagger.sh
      - name: Materialize trusted publish identity
        if: github.event_name != 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REGISTRY_USERNAME: ${{ github.actor }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        with:
          github-token: unused
          script: |
            const fs = require("fs")
            const path = require("path")
            const sourceSha = process.env.SOURCE_SHA
            if (!/^[0-9a-f]{40}$/.test(sourceSha)) {
              throw new Error("source SHA must be a full lowercase Git SHA-1")
            }
            const payload = {
              created: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
              ref_name: process.env.REF_NAME,
              ref_type: process.env.REF_TYPE,
              registry_username: process.env.REGISTRY_USERNAME,
              source_repository: process.env.SOURCE_REPOSITORY,
              source_sha: sourceSha,
            }
            const output = process.env.MANJA_METADATA
            fs.mkdirSync(path.dirname(output), {recursive: true})
            fs.writeFileSync(output, JSON.stringify(payload), {encoding: "utf8", flag: "wx", mode: 0o600})
      - name: Build and publish exact image set with Dagger
        if: github.event_name != 'pull_request'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$REGISTRY_TOKEN"
          dagger call publish-image \
            --source=. \
            --metadata="$MANJA_METADATA" \
            --registry-token=env://REGISTRY_TOKEN \
            --run-nonce='${{ github.run_id }}-${{ github.run_attempt }}'

  deploy:
    name: Trigger Fly deploy
    needs: [test, integration]
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.actor &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-pr"]') ||
        github.event_name == 'push' &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-trusted"]') ||
        'ubuntu-latest'
      }}
    concurrency: deploy-group
    env:
      MANJA_METADATA: ${{ github.workspace }}/.dagger-inputs/manja-deploy.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install or verify exact Dagger CLI
        if: github.event_name != 'pull_request'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash .github/scripts/setup-dagger.sh
      - name: Materialize trusted deployment identity
        if: github.event_name != 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        with:
          github-token: unused
          script: |
            const fs = require("fs")
            const path = require("path")
            const payload = {
              source_repository: process.env.SOURCE_REPOSITORY,
              source_run_id: process.env.SOURCE_RUN_ID,
              source_sha: process.env.SOURCE_SHA,
            }
            const output = process.env.MANJA_METADATA
            fs.mkdirSync(path.dirname(output), {recursive: true})
            fs.writeFileSync(output, JSON.stringify(payload), {encoding: "utf8", flag: "wx", mode: 0o600})
      - name: Dispatch central deployment with Dagger
        if: github.event_name != 'pull_request'
        env:
          FLY_DEPLOY_DISPATCH_TOKEN: ${{ secrets.FLY_DEPLOY_DISPATCH_TOKEN }}
        run: |
          test -n "$FLY_DEPLOY_DISPATCH_TOKEN"
          dagger call dispatch-fly \
            --metadata="$MANJA_METADATA" \
            --token=env://FLY_DEPLOY_DISPATCH_TOKEN \
            --run-nonce='${{ github.run_id }}-${{ github.run_attempt }}'
