name: Notify OpenAPI catalog

on:
  push:
    branches: [main]
    tags: ['openapi/**']
    paths: ['api/**']
  release:
    types: [published]

permissions: {}

jobs:
  notify:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'openapi/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint a token restricted to catalog workflow dispatch
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ARAIHU_ASSETS_APP_ID }}
          private-key: ${{ secrets.ARAIHU_ASSETS_APP_PRIVATE_KEY }}
          owner: araihu
          repositories: oapi
          permission-actions: write
      - name: Reconcile canonical branches and tags
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'araihu',
              repo: 'oapi',
              workflow_id: 'publish.yml',
              ref: 'main',
              inputs: { force: 'false' },
            });
