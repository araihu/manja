  <title id="title">Manja v11 icon</title>
  <desc id="desc">Adaptive Manja icon with an adaptive surface; colors respond to light and dark themes.</desc>
  <style>.v11-surface {
  fill: var(--araihu-logo-surface, var(--araihu-logo-auto-surface, #f3f2e9));
}
.v11-ink {
