#:schema https://json.schemastore.org/any.json

# `go run ./cmd/dev` wraps this config. The launcher
# chooses per-worktree ports and passes them to Air as CLI overrides.

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/manja-dev"
  cmd = "go run ./cmd/webassets generate && go run github.com/a-h/templ/cmd/templ generate && go build -o ./tmp/manja-dev ./cmd/manja"
  delay = 300
  entrypoint = ["./tmp/manja-dev", "-addr", "127.0.0.1:8080", "-data-dir", ".manja/data"]
  exclude_dir = ["tmp", "vendor", ".cache", ".git", ".manja", "api/dist", "internal/webassets/vendor"]
  exclude_file = []
  exclude_regex = ["_test\\.go", "_templ\\.go", "internal/web/static/schema-example\\.js", "internal/web/static/request-composer\\.js", "internal/web/static/.*\\.css"]
  exclude_unchanged = false
  follow_symlink = false
  include_dir = []
  include_ext = ["go", "templ", "css", "js", "json", "yaml", "yml"]
  include_file = ["muamba.yaml", "internal/webassets/vendor.overlay.yaml"]
  kill_delay = "500ms"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  mode = ""
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = true

[proxy]
  app_port = 8080
  app_start_timeout = 5000
  enabled = true
  proxy_port = 7331

[screen]
  clear_on_rebuild = false
  keep_scroll = true
